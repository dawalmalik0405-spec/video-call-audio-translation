<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Translation Room</title>
  <link rel="stylesheet" href="/css/style.css" />
  <!-- Socket.IO client -->
  <script src="/socket.io/socket.io.js"></script>
  <!-- App logic -->
  <script src="/js/main.js" defer></script>
</head>

<body>
  <!-- Modern Display Name Overlay Modal -->
  <div id="username-modal" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <div class="modal-brand">
        <span class="brand-dot"></span>
        <h2>TranslateMeet</h2>
      </div>
      <h3>Join the Meeting</h3>
      <p>Enter your display name to connect to this live translation room.</p>
      <div class="modal-input-wrapper">
        <input type="text" id="username-modal-input" placeholder="Your Display Name" autocomplete="off" />
      </div>
      <button id="username-modal-submit" class="modal-btn">Join Meeting</button>
    </div>
  </div>

  <div class="app-layout">

    <!-- ========== MAIN CONTENT ========== -->
    <div class="main-content">

      <!-- Top Header -->
      <header class="top-header">
        <div class="header-left">
          <button class="back-btn" onclick="window.history.back()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M15 18l-6-6 6-6"/>
            </svg>
          </button>
          <div class="header-title">
            <h1 id="meeting-id-display">Loading room...</h1>
            <span id="header-subtitle-info" class="header-subtitle">Loading...</span>
          </div>
        </div>

        <div class="header-right">
          <!-- Recording timer -->
          <div class="recording-indicator">
            <span class="red-dot"></span>
            <span id="call-timer">01:43:32</span>
          </div>


          <!-- Username + Disconnect -->
          <div class="user-pill">
            <span id="header-username">You</span>
            <span class="pill-divider">|</span>
            <button id="disconnect-header-btn" class="disconnect-link">Disconnect</button>
          </div>
        </div>
      </header>

      <!-- ========== VIDEO AREA ========== -->
      <div class="video-area">

        <!-- Remote (large) video -->
        <div class="remote-container">
          <video id="remoteVideo" autoplay playsinline></video>

          <!-- Translation badge -->
          <div class="video-badge recording-badge">
            <span class="red-dot"></span> Translation is active...
          </div>

          <!-- Language selector (top right of video) -->
          <div class="video-badge translator-controls">
            <select id="srcLang" class="lang-select-light">
              <option value="en">English</option>
              <option value="hi">Hindi</option>
              <option value="de">German</option>
              <option value="zh-cn">Chinese</option>
            </select>
            <span class="lang-arrow">→</span>
            <select id="tgtLang" class="lang-select-light">
              <option value="hi">Hindi</option>
              <option value="en">English</option>
              <option value="de">German</option>
              <option value="zh-CN">Chinese</option>
            </select>
            <button id="setLangBtn" class="apply-lang-btn">Apply</button>
          </div>

          <!-- Subtitle overlay -->
          <div id="subtitle" class="subtitle-overlay"></div>

          <!-- Control bar (bottom center of video) -->
          <div class="overlay-controls">
            <button id="mute-audio-btn" class="control-btn dark-circle" title="Mute">🎙️</button>
            <button id="mute-video-btn" class="control-btn dark-circle" title="Camera">📷</button>
            <button id="toggle-chat-btn" class="control-btn dark-circle" title="Chat">💬</button>
            <button class="control-btn dark-circle" title="Emoji">😊</button>
            <button class="control-btn dark-circle" title="Timer">🕑</button>
            <!-- Red end-call button — always visible in control bar -->
            <button id="end-call-btn" class="control-btn end-call-circle" title="End call">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5">
                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- ========== BOTTOM THUMBNAIL STRIP ========== -->
        <div class="thumbnail-strip">
          <!-- Local video thumbnail -->
          <div class="thumbnail local-thumb">
            <video id="localVideo" autoplay muted playsinline></video>
            <div class="thumb-label">You</div>
          </div>

          <!-- User list (populated by JS via #allusers) -->
          <div class="user-list-strip">
            <ul id="allusers"></ul>
          </div>
        </div>

      </div><!-- /video-area -->
    </div><!-- /main-content -->

    <!-- ========== RIGHT SIDEBAR (Chat / Transcript) ========== -->
    <aside class="right-sidebar">
      <div class="chat-header">
        <h2>Group chat</h2>
        <button class="close-btn" id="close-chat-btn">×</button>
      </div>
      <div class="chat-tabs">
        <button class="tab active" id="tab-all">All messages</button>
        <button class="tab" id="tab-private">Private <span class="badge">2</span></button>
      </div>

      <!-- Transcript / chat messages -->
      <div id="transcript-log" class="chat-messages"></div>

      <div class="chat-input-area">
        <input type="text" id="chat-input" placeholder="Type a message..." autocomplete="off" />
        <button class="send-btn" id="send-chat-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
            <path d="M22 2L11 13"/>
            <path d="M22 2l-7 20-4-9-9-4 20-7z"/>
          </svg>
        </button>
      </div>
    </aside>

  </div><!-- /app-layout -->
</body>

</html>
